---
# Ansible Inventory: [ENVIRONMENT]
# Format: YAML inventory file
# Usage: ansible-playbook -i inventory/[ENVIRONMENT]/hosts.yml playbook.yml

all:
  children:
    webservers:
      hosts:
        web1.example.com:
          ansible_host: <LAN_IP>
        web2.example.com:
          ansible_host: <LAN_IP>

    databases:
      hosts:
        db1.example.com:
          ansible_host: <LAN_IP>
        db2.example.com:
          ansible_host: <LAN_IP>

    loadbalancers:
      hosts:
        lb1.example.com:
          ansible_host: <LAN_IP>

  vars:
    ansible_user: deploy
    ansible_python_interpreter: /usr/bin/python3
    env: [ENVIRONMENT]
